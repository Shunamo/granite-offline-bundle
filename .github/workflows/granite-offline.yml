name: Build Granite Embedding 97M R2 Offline Bundle

# 사내망은 huggingface.co를 차단하므로, HF에 접근 가능한 GitHub-hosted runner에서
# 모델을 받아 zip으로 묶고 GitHub Actions Artifact로만 배포한다.
# 회사 PC는 이 zip을 github.com/GitHub Actions UI를 통해서만 받는다 - huggingface.co에
# 직접 요청을 보내는 코드는 이 워크플로 어디에도 없다.

on:
  workflow_dispatch:
    inputs:
      model_revision:
        description: "고정할 HF revision/commit SHA (비우면 실행 시점의 main 브랜치 SHA를 자동 resolve)"
        required: false
        default: ""

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install download dependencies
        run: pip install "huggingface_hub>=0.25,<1.0"

      - name: Download Granite 97M R2 snapshot (pinned revision, integrity-checked)
        env:
          HF_REVISION_INPUT: ${{ inputs.model_revision }}
        run: python scripts/ci/download_granite.py

      - name: Strip HF cache metadata / LFS tracking files from bundle
        run: |
          find granite-embedding-97m-multilingual-r2 -type d -name ".cache" -exec rm -rf {} + 2>/dev/null || true
          find granite-embedding-97m-multilingual-r2 -type f -name ".gitattributes" -delete 2>/dev/null || true

      - name: Show bundle contents
        run: |
          echo "--- manifest.json ---"
          cat manifest.json
          echo "--- MODEL_REVISION.txt ---"
          cat MODEL_REVISION.txt
          echo "--- 전체 용량 ---"
          du -sh granite-embedding-97m-multilingual-r2

      - name: Zip offline bundle
        run: |
          zip -r granite-embedding-97m-multilingual-r2-offline.zip \
            granite-embedding-97m-multilingual-r2 \
            manifest.json \
            MODEL_REVISION.txt

      - name: SHA256 checksum
        run: |
          sha256sum granite-embedding-97m-multilingual-r2-offline.zip | tee granite-embedding-97m-multilingual-r2-offline.sha256

      - name: Install validation dependencies (sentence-transformers + onnx/openvino extras)
        run: |
          pip install "sentence-transformers[onnx]"
          pip install "sentence-transformers[openvino]" || echo "openvino extra 설치 실패 - 검증 단계에서 SKIP 처리됨"

      - name: Offline load test (extract to a clean dir, block HF domains, no cache reuse)
        run: |
          mkdir -p /tmp/offline_extract
          unzip -q granite-embedding-97m-multilingual-r2-offline.zip -d /tmp/offline_extract

          # 방금 받은 HF 캐시(~/.cache/huggingface)를 지워서 "캐시 덕분에 성공"하는
          # 거짓 양성을 막는다.
          rm -rf ~/.cache/huggingface

          # huggingface.co 계열 도메인을 실제로 블랙홀 처리해서, 코드가 몰래
          # 네트워크를 타는 경우까지 잡아낸다 (env var만으로는 안 잡히는 실수 방지).
          echo "0.0.0.0 huggingface.co" | sudo tee -a /etc/hosts
          echo "0.0.0.0 cdn-lfs.huggingface.co" | sudo tee -a /etc/hosts
          echo "0.0.0.0 hf.co" | sudo tee -a /etc/hosts

          HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 python tests/test_granite_offline.py \
            /tmp/offline_extract/granite-embedding-97m-multilingual-r2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: granite-embedding-97m-multilingual-r2-offline
          path: |
            granite-embedding-97m-multilingual-r2-offline.zip
            granite-embedding-97m-multilingual-r2-offline.sha256
            MODEL_REVISION.txt
            manifest.json
          retention-days: 90
